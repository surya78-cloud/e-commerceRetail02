services:
  - type: web
    name: fieldwork-retail
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/products
    envVars:
      - key: APP_STORAGE_MODE
        value: in-memory
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
